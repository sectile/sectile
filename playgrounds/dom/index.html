<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Keyboard interaction demos for every @sectile/dom facade." />
    <title>Sectile DOM playground</title>
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div>
          <h1>Sectile interaction lab</h1>
          <p id="demo-description" class="lede"></p>
        </div>
        <div class="actions">
          <button id="focus-button" type="button">Focus demo</button>
          <button id="reset-button" type="button" class="secondary">Reset</button>
        </div>
      </header>

      <nav id="demo-nav" class="demo-nav" aria-label="Examples"></nav>
      <section id="shortcuts" class="shortcuts" aria-label="Keyboard shortcuts"></section>

      <div class="workspace">
        <section class="panel demo-panel">
          <div class="panel-heading">
            <h2 id="demo-title"></h2>
            <span id="revision-badge" class="badge"></span>
          </div>
          <div id="demo-surface" class="demo-surface"></div>
        </section>

        <aside class="inspector">
          <section class="panel">
            <div class="panel-heading">
              <h2>State</h2>
            </div>
            <pre id="state-output"></pre>
          </section>

          <section class="panel log-panel">
            <div class="panel-heading">
              <h2>Events & effects</h2>
            </div>
            <ol id="event-log" class="event-log"></ol>
          </section>
        </aside>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
