<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Keyboard interaction demos for every @sectile/dom facade." />
    <title>Sectile DOM playground</title>
  </head>
  <body>
    <main class="shell">
      <aside class="component-rail">
        <div class="rail-heading">
          <span class="rail-mark" aria-hidden="true"></span>
          <strong>Components</strong>
        </div>
        <nav id="demo-nav" class="demo-nav" aria-label="Component categories"></nav>
      </aside>

      <section class="playground-content">
        <header class="hero">
          <div>
            <h1>Sectile interaction lab</h1>
            <p id="demo-description" class="lede"></p>
          </div>
        </header>

        <section id="shortcuts" class="shortcuts" aria-label="Demo controls">
          <div id="shortcut-list" class="shortcut-list"></div>
          <button id="reset-button" type="button" class="reset-button secondary"></button>
        </section>

        <div id="workspace" class="workspace"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
