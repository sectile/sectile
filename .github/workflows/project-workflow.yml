name: project-workflow

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: project-workflow-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  mutate:
    if: >-
      github.event_name == 'issues' ||
      startsWith(github.event.comment.body, '/sectile-workflow')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Create scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SECTILE_PROJECT_APP_CLIENT_ID }}
          private-key: ${{ secrets.SECTILE_PROJECT_APP_PRIVATE_KEY }}
          owner: sectile
          repositories: sectile
      - name: Validate evidence and update canonical Workflow
        run: node scripts/github-project-workflow-event.mjs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
