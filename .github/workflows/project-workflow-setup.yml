name: project-workflow-setup

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-workflow-setup
  cancel-in-progress: false

jobs:
  setup:
    environment: github-project-setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Create scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SECTILE_PROJECT_APP_CLIENT_ID }}
          private-key: ${{ secrets.SECTILE_PROJECT_APP_PRIVATE_KEY }}
          owner: sectile
          repositories: sectile
      - name: Inspect current Project and Workflow state
        run: node scripts/github-project-workflow.mjs plan
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Apply idempotent setup
        run: node scripts/github-project-workflow.mjs setup --apply
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
