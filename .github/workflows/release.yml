name: release
run-name: release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to retry
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  pages: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 24.x
            verification: verify:release
          - node: 26.x
            verification: verify:compat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Require a main-branch release commit
        run: |
          git fetch origin main --tags
          git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}"
          git merge-base --is-ancestor "refs/tags/${RELEASE_TAG}^{commit}" origin/main
      - name: Protect tagged package contents
        run: git diff --exit-code "refs/tags/${RELEASE_TAG}^{commit}" HEAD -- packages/core packages/temporal packages/virtual packages/dom packages/terminal packages/vue pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.verification }}
      - if: matrix.node == '24.x'
        run: pnpm release:check "$RELEASE_TAG"
      - if: matrix.node == '24.x'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: matrix.node == '24.x'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check "$RELEASE_TAG"
      - name: Publish npm packages with OIDC
        run: pnpm publish:packages
      - name: Ensure GitHub release
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub release ${RELEASE_TAG} already exists"
          else
            gh release create "$RELEASE_TAG" --verify-tag --notes-from-tag --title "$RELEASE_TAG"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  deploy-docs:
    needs: [verify, publish]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
