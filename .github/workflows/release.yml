name: release
run-name: release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to retry
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  pages: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm
      - name: Confirm the release tag belongs to main
        run: |
          git fetch origin main --tags
          git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}"
          git merge-base --is-ancestor "refs/tags/${RELEASE_TAG}^{commit}" origin/main
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check "$RELEASE_TAG"
      - name: Pack release npm artifacts
        run: pnpm publish:packages -- --pack-only --pack-destination=release-artifacts
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: npm-packages-${{ inputs.tag }}
          path: release-artifacts/*.tgz
          if-no-files-found: error
          retention-days: 7
      - name: Build release documentation
        run: pnpm --filter @sectile/docs build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: npm-packages-${{ inputs.tag }}
          path: release-artifacts
      - name: Load current publication tooling
        run: |
          git fetch origin main
          git restore --source=origin/main -- \
            scripts/publish-packages.mjs \
            scripts/release-metadata.mjs \
            scripts/lib/npm-registry-artifact.mjs \
            scripts/lib/npm-publish-auth.mjs \
            scripts/lib/packed-package-contract.mjs \
            scripts/lib/portable-process.mjs \
            scripts/lib/published-packages.mjs \
            scripts/lib/release.mjs \
            scripts/lib/release-set.mjs \
            scripts/lib/repository.mjs \
            scripts/lib/source-map-policy.mjs \
            scripts/lib/workspace-graph.mjs
      - name: Publish npm packages with OIDC
        run: node scripts/publish-packages.mjs --tarball-directory=release-artifacts
      - name: Ensure GitHub release
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub release ${RELEASE_TAG} already exists"
          else
            RELEASE_TITLE="$(node scripts/release-metadata.mjs title "$RELEASE_TAG")"
            gh release create "$RELEASE_TAG" --verify-tag --notes-from-tag --title "$RELEASE_TITLE"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  deploy-docs:
    needs: [prepare, publish]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
