name: deep-verification

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

jobs:
  deep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm install
      - run: npm run build:verification
      - run: npm run verify:theory
      - run: npm run verify:reproducible-build
      - run: npm run verify
